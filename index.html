<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Raid Loot Atlas</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Where loot spawns on every map of our SPT server, with the odds per raid.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: full-height tool. Field kit sidebar on the left, 3D map fills the rest; stacks map-over-panel on phones.
   Deliberately single dark look: a night-vision map table, loot glows like the raid-guide reference. */
:root {
  color-scheme: dark;
  --bg: #0b0f12;          /* map table, blue-black */
  --panel: #12181c;       /* kit sidebar */
  --raise: #192127;       /* inputs, rows */
  --line: #26313a;        /* hairlines */
  --fg: #dfe2dc;          /* bone text */
  --muted: #8b969d;       /* secondary text */
  --faint: #5b6770;       /* tertiary */
  --glow: #ff8a2a;        /* loot glow, the one accent */
  --cont: #8fd6ea;        /* container diamonds */
  --route: #ff5fd2;       /* loot run */
  --glow-hot: #ffd27a;    /* glow core */
  --glow-ink: #1a0d02;    /* text on glow */
  --cold: #6fb7c9;        /* containers, secondary data */
  --todo: #c9a64a;
  --exit-pmc: #74c69d;    /* PMC extract */
  --exit-scav: #b79cff;   /* Scav extract */
  --exit-any: #e8ecef;    /* both sides */
  --transit: #7fd1e0;     /* transit to another map */
  --door-need: #e5484d;   /* locked, no key */
  --door-ok: #46c27a;     /* locked, you have the key */
  --door-breach: #e8a33d; /* can be breached */
  --font-display: "Chakra Petch", "Bahnschrift", "DIN Alternate", "Arial Narrow", sans-serif;
  --font-body: "Barlow", "Segoe UI", system-ui, sans-serif;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 14px; overflow: hidden; }
* { box-sizing: border-box; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--glow); outline-offset: 2px; }

.app { display: grid; grid-template-columns: 340px minmax(0, 1fr) 264px; height: 100%; }
.kit {
  background: var(--panel); border-right: 1px solid var(--line);
  display: flex; flex-direction: column; min-height: 0; overflow: hidden;
}
.kit-scroll { overflow-y: auto; padding-block: 16px 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 16px; display: flex; flex-direction: column; gap: 20px; min-height: 0; }
.kit.ctrl { border-right: none; border-left: 1px solid var(--line); }
.kit.ctrl .kit-scroll { padding-left: 16px; padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.ctrl .maps { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.brand h1 { font-family: var(--font-display); font-weight: 700; font-size: 20px; letter-spacing: .06em; text-transform: uppercase; margin: 0; }
.brand small { color: var(--faint); font-size: 12px; letter-spacing: .04em; }
.label { font-family: var(--font-display); font-size: 11px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }

.maps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.map-btn {
  background: var(--raise); border: 1px solid var(--line); border-radius: 3px; padding: 7px 6px;
  font-family: var(--font-display); font-weight: 600; font-size: 12px; letter-spacing: .04em; text-transform: uppercase;
  cursor: pointer; text-align: left; line-height: 1.2; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.map-btn:hover { border-color: var(--faint); }
.map-btn[aria-pressed="true"] { border-color: var(--glow); color: var(--glow); }
.map-btn[disabled] { cursor: not-allowed; color: var(--faint); border-style: dashed; }
.map-btn .tag { display: block; font-family: var(--font-body); font-weight: 500; font-size: 10px; letter-spacing: .08em; color: var(--todo); }
.variants { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.variants[hidden] { display: none !important; }
.chip {
  background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; font-size: 12px; cursor: pointer; color: var(--muted);
}
.chip[aria-pressed="true"] { border-color: var(--glow); color: var(--fg); background: color-mix(in srgb, var(--glow) 14%, transparent); }

.field { display: flex; flex-direction: column; gap: 8px; }
.search { position: relative; }
.search input {
  width: 100%; background: var(--raise); border: 1px solid var(--line); border-radius: 3px; padding: 9px 10px 9px 32px;
}
.search input::placeholder { color: var(--faint); }
.search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; stroke: var(--faint); fill: none; stroke-width: 2; }
.row2 { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 8px; }
select { width: 100%; background: var(--raise); border: 1px solid var(--line); border-radius: 3px; padding: 8px; min-width: 0; }

.selection {
  border: 1px solid color-mix(in srgb, var(--glow) 45%, var(--line)); border-radius: 4px; padding: 12px;
  background: color-mix(in srgb, var(--glow) 6%, var(--panel)); display: flex; flex-direction: column; gap: 10px;
}
.sel-head { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.sel-name { font-family: var(--font-display); font-weight: 600; font-size: 16px; line-height: 1.2; text-wrap: balance; }
.sel-sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
.clear { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 12px; padding: 2px 0; white-space: nowrap; }
.clear:hover { color: var(--fg); }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stat b { display: block; font-family: var(--font-display); font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--glow); line-height: 1.1; }
.stat span { font-size: 11px; color: var(--muted); }

.list { display: flex; flex-direction: column; }
.item {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; align-items: baseline;
  padding: 7px 8px; border: none; background: none; border-bottom: 1px solid var(--line); text-align: left; cursor: pointer; width: 100%;
}
.item:hover { background: var(--raise); }
.item[aria-current="true"] { background: color-mix(in srgb, var(--glow) 12%, transparent); }
.item .n { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .e { font-variant-numeric: tabular-nums; color: var(--glow); font-weight: 600; font-size: 13px; }
.item .m { grid-column: 1 / -1; font-size: 11px; color: var(--faint); }
.bar { height: 2px; grid-column: 1 / -1; background: var(--line); border-radius: 1px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--glow); }
.empty { color: var(--muted); font-size: 13px; padding: 8px 0; }

.cont { display: flex; flex-direction: column; gap: 6px; }
.cont-row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 10px; font-size: 13px; align-items: baseline; }
.cont-row .n { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cont-row .c { color: var(--faint); font-variant-numeric: tabular-nums; font-size: 12px; }
.cont-row .p { color: var(--cold); font-variant-numeric: tabular-nums; font-weight: 600; min-width: 44px; text-align: right; }
.note { font-size: 12px; color: var(--faint); line-height: 1.5; }
.note b { color: var(--muted); font-weight: 600; }

.slice { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 6px 10px; align-items: center; font-size: 12px; color: var(--muted); }
.slice input { width: 100%; accent-color: var(--glow); }
.slice output { font-variant-numeric: tabular-nums; color: var(--fg); min-width: 52px; text-align: right; }

.stage { position: relative; min-width: 0; min-height: 0; overflow: hidden; }
.stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.hud { position: absolute; top: 12px; left: 12px; right: max(12px, env(safe-area-inset-right, 0px)); display: flex; gap: 8px; flex-wrap: wrap; pointer-events: none; }
.badge {
  pointer-events: auto; background: color-mix(in srgb, var(--bg) 82%, transparent); border: 1px solid var(--line); border-radius: 3px;
  padding: 5px 9px; font-size: 12px; color: var(--muted); backdrop-filter: blur(6px);
}
.badge strong { color: var(--fg); font-family: var(--font-display); letter-spacing: .06em; text-transform: uppercase; font-weight: 600; }
.badge.warn { color: var(--todo); border-color: color-mix(in srgb, var(--todo) 40%, var(--line)); }
.help { position: absolute; bottom: 12px; right: max(12px, env(safe-area-inset-right, 0px)); font-size: 11px; color: var(--faint); pointer-events: none; text-align: right; }
.labels { position: absolute; inset: 0; pointer-events: none; }
.rpin { position: absolute; transform: translate(-50%, -50%); display: grid; place-items: center; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px;
  background: var(--route); color: #160612; font: 700 11px/1 var(--font-body); box-shadow: 0 0 0 2px rgba(0,0,0,.55); white-space: nowrap; }
.rpin.key { background: var(--bg); color: var(--door-need); border: 1px solid var(--door-need); font-weight: 600; }
.rpin.key.ok { color: var(--door-ok); border-color: var(--door-ok); }
.rpin.end { background: var(--exit-pmc); color: #04140c; }
.run-form { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
.run-row { display: grid; grid-template-columns: 48px 1fr auto; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.run-row select { grid-column: 2 / 4; }
.run-row output { font-variant-numeric: tabular-nums; color: var(--fg); min-width: 18px; text-align: right; }
.run-total { display: flex; gap: 14px; margin: 4px 0 10px; }
.run-total b { font-size: 18px; color: var(--route); font-family: var(--font-display); }
.run-total span { font-size: 11px; color: var(--muted); display: block; }
.run-steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; font-size: 12px; }
.run-steps li { display: grid; grid-template-columns: 22px 1fr auto; gap: 8px; align-items: baseline; padding: 5px 0; border-bottom: 1px solid var(--line); }
.run-steps li i { font-style: normal; font-weight: 700; color: var(--route); text-align: center; }
.run-steps li.door i { color: var(--door-need); } .run-steps li.door.ok i { color: var(--door-ok); }
.run-steps li small { color: var(--muted); font-variant-numeric: tabular-nums; }
.run-keys { margin-top: 10px; font-size: 12px; }
.run-keys b { color: var(--door-need); }
.pin {
  position: absolute; transform: translate(-50%, calc(-100% - 10px)); display: flex; align-items: center; gap: 6px;
  background: rgba(14, 16, 18, .88); border: 1px solid color-mix(in srgb, var(--glow) 70%, transparent); border-radius: 999px;
  padding: 3px 10px 3px 3px; white-space: nowrap; font-family: var(--font-display); font-weight: 600; font-size: 12px; letter-spacing: .05em; color: var(--fg);
}
.pin i { font-style: normal; width: 20px; height: 20px; border-radius: 50%; background: var(--glow); color: var(--glow-ink); display: grid; place-items: center; font-size: 11px; }
.pin::after { content: ""; position: absolute; left: 50%; bottom: -11px; width: 1px; height: 10px; background: var(--glow); }
.tip {
  position: absolute; pointer-events: none; background: rgba(12, 15, 17, .95); border: 1px solid var(--line); border-radius: 4px; padding: 10px 12px;
  font-size: 12px; max-width: 280px; min-width: 200px; box-shadow: 0 8px 24px rgba(0,0,0,.4);
}
.tip h4 { margin: 0 0 6px; font-family: var(--font-display); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.tip .line { color: var(--fg); margin: 0 0 8px; }
.tip .line b { color: var(--glow); font-variant-numeric: tabular-nums; }
.tip .r { display: grid; grid-template-columns: minmax(0, 1fr) 56px 64px; gap: 8px; padding: 2px 0; color: var(--muted); }
.tip .r span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tip .r span:not(:first-child) { font-variant-numeric: tabular-nums; text-align: right; }
.tip .r.th { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); border-bottom: 1px solid var(--line); padding-bottom: 4px; margin-bottom: 2px; }
.tip .r.hit { color: var(--glow); }
.tip .r.hit span:first-child { color: var(--fg); }
.tip { max-width: 320px; }
.marks { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.place {
  position: absolute; transform: translate(-50%, -50%); white-space: nowrap; font-family: var(--font-display); font-weight: 600;
  text-transform: uppercase; letter-spacing: .12em; color: var(--fg); opacity: .9; font-size: 11px;
  text-shadow: 0 0 3px var(--bg), 0 0 6px var(--bg), 0 1px 2px var(--bg);
}
.place.big { font-size: 13px; letter-spacing: .14em; }
.exit {
  position: absolute; transform: translate(-50%, calc(-100% - 4px)); display: flex; align-items: center; gap: 5px; white-space: nowrap;
  background: rgba(10, 13, 15, .86); border: 1px solid var(--line); border-left: 3px solid var(--c); border-radius: 2px;
  padding: 2px 7px 2px 5px; font-size: 11px; color: var(--fg);
}
.exit b { font-family: var(--font-display); font-weight: 600; font-size: 9px; letter-spacing: .12em; color: var(--c); }
.toggles { display: flex; flex-wrap: wrap; gap: 6px; }
.toggles .chip { display: inline-flex; align-items: center; gap: 6px; }
.toggles .chip i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); display: inline-block; }
.floors { display: flex; flex-direction: column; gap: 4px; }
.floors button {
  display: flex; justify-content: space-between; align-items: baseline; gap: 8px; text-align: left;
  background: var(--raise); border: 1px solid var(--line); border-radius: 3px; padding: 7px 10px; cursor: pointer;
  font-family: var(--font-display); font-weight: 600; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--fg);
}
.floors button small { font-family: var(--font-body); font-weight: 500; font-size: 11px; letter-spacing: 0; text-transform: none; color: var(--faint); font-variant-numeric: tabular-nums; }
.floors button:hover { border-color: var(--faint); }
.floors button[aria-pressed="true"] { border-color: var(--glow); color: var(--glow); }
.keys { display: flex; flex-direction: column; gap: 4px; }
.drop > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px;
  background: var(--raise); border: 1px solid var(--line); border-radius: 3px; padding: 9px 10px; }
.drop > summary::-webkit-details-marker { display: none; }
.drop > summary::after { content: ""; width: 7px; height: 7px; border-right: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted); transform: rotate(45deg) translateY(-2px); transition: transform .15s; }
.drop[open] > summary::after { transform: rotate(225deg) translateY(-1px); }
.drop > summary:hover { border-color: var(--faint); }
.drop > summary .label { margin: 0; }
.drop > summary .sum { min-width: 0; font-size: 11px; color: var(--muted); text-align: right; display: flex; flex-direction: column; gap: 1px; }
.drop > summary .sum span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.drop > summary .sum b { color: var(--glow); font-weight: 600; }
.drop[open] > summary { margin-bottom: 8px; }
.key {
  display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; gap: 8px; align-items: center; text-align: left; cursor: pointer;
  background: var(--raise); border: 1px solid var(--line); border-radius: 3px; padding: 7px 9px; font-size: 12px;
}
.key i { width: 12px; height: 12px; border-radius: 2px; border: 1px solid var(--faint); display: grid; place-items: center; font-style: normal; font-size: 10px; }
.key[aria-pressed="true"] { border-color: var(--door-ok); }
.key[aria-pressed="true"] i { background: var(--door-ok); border-color: var(--door-ok); color: var(--bg); }
.key .n { min-width: 0; }
.key .d { color: var(--faint); font-variant-numeric: tabular-nums; font-size: 11px; display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
.key .n { display: flex; flex-direction: column; gap: 2px; }
.key .n > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.key .n small { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; white-space: normal; }
.key .best { font-weight: 600; font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--glow); }
#reach-row { margin-bottom: 8px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 11px; color: var(--muted); margin-top: 8px; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 10px; height: 10px; border-radius: 2px; background: var(--c); }
.loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-family: var(--font-display); letter-spacing: .12em; text-transform: uppercase; font-size: 13px; pointer-events: none; }

@media (max-width: 1100px) {
  .app { grid-template-columns: 300px minmax(0, 1fr) 232px; }
}
@media (max-width: 760px) {
  body { overflow: auto; }
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: 56vh auto auto; height: auto; min-height: 100%; }
  .stage { order: -2; height: 56vh; }
  .kit.ctrl { order: -1; }
  .kit, .kit.ctrl { border-right: none; border-left: none; border-top: 1px solid var(--line); overflow: visible; }
  .kit.ctrl .kit-scroll { padding-left: max(16px, env(safe-area-inset-left, 0px)); }
  .ctrl .maps { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .kit-scroll { overflow: visible; padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .help { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
[hidden] { display: none !important; }
body { margin: 0; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
</style>
</head>
<body>
<div class="app">
  <aside class="kit loot" aria-label="Loot">
    <div class="kit-scroll">
      <div class="brand">
        <h1>Raid Loot Atlas</h1>
        <small>SurvivalPack server</small>
      </div>

      <section class="field">
        <p class="label">Find loot</p>
        <div class="search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
          <input id="q" type="search" placeholder="Item name, e.g. LEDX, GPU, Salewa" autocomplete="off" aria-label="Search items on this map">
        </div>
        <div class="row2">
          <select id="cat" aria-label="Loot type"></select>
          <select id="price" aria-label="Minimum value">
            <option value="0">Any value</option>
            <option value="25000">≥ ₽25k</option>
            <option value="50000">≥ ₽50k</option>
            <option value="100000" selected>≥ ₽100k</option>
            <option value="250000">≥ ₽250k</option>
          </select>
        </div>
      </section>

      <section class="selection" id="selection" aria-live="polite"></section>

      <section id="run-sec" hidden>
        <details class="drop" id="run-drop">
          <summary><span class="label">Loot run</span><span class="sum" id="run-sum"></span></summary>
          <div class="run-form">
            <label class="run-row"><span>Spawn</span><select id="run-spawn" aria-label="Spawn"></select></label>
            <p class="note">Or click a spawn dot on the map.</p>
            <label class="run-row"><span>Stops</span><input type="range" id="run-n" min="2" max="12" step="1" value="6"><output id="run-n-o">6</output></label>
            <div class="toggles"><button class="chip" id="run-anykey" aria-pressed="false" style="--c: var(--door-need)"><i></i>Use keys I don't have</button></div>
          </div>
          <div id="run-out" aria-live="polite"></div>
        </details>
      </section>

      <section>
        <p class="label" id="list-label">Items</p>
        <div class="list" id="list"></div>
      </section>

      <section>
        <p class="label">Containers on this map</p>
        <div class="cont" id="containers"></div>
      </section>

      <p class="note" id="about"></p>
    </div>
  </aside>

  <main class="stage" id="stage">
    <canvas id="c"></canvas>
    <div class="marks" id="marks"></div>
    <div class="labels" id="labels"></div>
    <div class="labels" id="runmarks"></div>
    <div class="hud" id="hud"></div>
    <div class="tip" id="tip" hidden></div>
    <div class="loading" id="loading">Loading spawn data</div>
    <div class="help">Drag to move · right-drag to orbit · scroll to zoom · hover a dot for its loot</div>
  </main>
  <aside class="kit ctrl" aria-label="Map controls">
    <div class="kit-scroll">
      <section>
        <p class="label">Map</p>
        <div class="maps" id="maps"></div>
        <div class="variants" id="variants" hidden></div>
      </section>

      <section id="keys-sec" hidden>
        <details class="drop" id="keys-drop">
          <summary><span class="label">My keys</span><span class="sum" id="keys-sum"></span></summary>
        <div class="toggles" id="reach-row" hidden><button class="chip" id="reach-only" aria-pressed="true" style="--c: var(--door-ok)"><i></i>Only loot I can reach</button></div>
        <div class="keys" id="keys"></div>
        <p class="note" id="keys-note"></p>
        </details>
      </section>

      <section id="floors-sec" hidden>
        <p class="label">Floors</p>
        <div class="floors" id="floors"></div>
      </section>

      <section>
        <p class="label">Show on map</p>

      blockCache[bid].dump = d && d.ok ? await d.json() : null;
      if (blockCache[bid].terrain) {
        const t = await fetch(`maps/${blockCache[bid].terrain}`);
        if (t.ok) blockCache[bid].ground = parseTerrain(await t.arrayBuffer());

    buildMarks(B.dump ? { labels: B.labels, exits: B.dump.exits } : B);
    buildDoors(B.dump);
    grid.visible = !B.ground && !B.geo;
    if (!B.ground) { // indoor maps: frame the building, not stray spots outside it
      const box = new THREE.Box3().setFromObject(blockRoot.children[0]);
      if (!box.isEmpty()) frame(box);
    }

function saveRun() { try { localStorage.setItem("atlas-run", JSON.stringify({ n: RUN.n, anyKey: RUN.anyKey })); } catch {} }
$("run-spawn").addEventListener("change", () => { RUN.spawn = +$("run-spawn").value; solveRun(); });
$("run-n").addEventListener("input", () => { RUN.n = +$("run-n").value; $("run-n-o").textContent = RUN.n; saveRun(); scheduleRun(); });
$("run-anykey").addEventListener("click", () => { RUN.anyKey = !RUN.anyKey; $("run-anykey").setAttribute("aria-pressed", String(RUN.anyKey)); saveRun(); scheduleRun(); });
$("run-drop").addEventListener("toggle", () => { if (spawnPts) spawnPts.visible = $("run-drop").open; });
// click a spawn dot to start there
canvas.addEventListener("click", (ev) => {
  if (!PJ || !$("run-drop").open) return;
  const r = canvas.getBoundingClientRect(), mx = ev.clientX - r.left, my = ev.clientY - r.top; let best = -1, bd = 14;
  PJ.sp.forEach((s, i) => { if (s[3] < 0) return; v3.set(...toWorld(s[0], s[1] + 0.5, s[2])).project(camera); if (v3.z > 1) return;
    const d = Math.hypot((v3.x + 1) / 2 * r.width - mx, (1 - v3.y) / 2 * r.height - my); if (d < bd) { bd = d; best = i; } });
  if (best >= 0) { RUN.spawn = best; renderRunForm(); solveRun(); }
});

// ---------- 2D map overlay (tarkov.dev SVG maps, CC BY-NC-SA 4.0) ----------
// bounds and orientation as in tools/build_blockouts.py; mode 0 "s,t", 1 "t,1-s", 2 "1-t,s".
// floors: the SVG layer for each floor button; outdoor maps keep the ground layer under an upper floor.
const OV = {
  bigmap: { svg: "Customs", b: [[698, -307], [-372, 237]], m: 0, base: "Ground_Level", all: ["Ground_Level", "Underground_Level", "First_Floor", "Second_Floor", "Third_Floor"] },
  woods: { svg: "Woods", b: [[646, -914], [-761, 442]], m: 0, base: "Ground_Level", all: ["Ground_Level"] },
  shoreline: { svg: "Shoreline", b: [[504, -415], [-1056, 618]], m: 0, base: "Ground_Level", all: ["Ground_Level", "Underground_Level", "First_Floor", "Second_Floor", "Third_Floor"] },
  lighthouse: { svg: "Lighthouse", b: [[515, -998], [-545, 725]], m: 0, base: "Ground_Level", all: ["Ground_Level"] },
  interchange: { svg: "Interchange", b: [[598, -442], [-433, 426]], m: 0, base: "Ground_Level", all: ["Ground_Level", "First_Floor", "Second_Floor"],
    floors: ["Ground_Level", "First_Floor", "Second_Floor"], keepBase: true },
  rezervbase: { svg: "Reserve", b: [[289, -274], [-303, 272]], m: 0, base: "Ground_Level", all: ["Ground_Level", "Bunkers"],
    floors: ["Bunkers", "Ground_Level", "Ground_Level"] },
  sandbox: { svg: "GroundZero", b: [[249, -124], [-99, 364]], m: 0, base: "Ground_Level", all: ["Ground_Level", "Underground_Level", "First_Floor", "Second_Floor", "Third_Floor"],
    floors: ["Underground_Level", "Ground_Level", "First_Floor", "Second_Floor"], keepBase: true },
  factory4_day: { svg: "Factory", b: [[77, -64.5], [-65.5, 67.4]], m: 1, shift: [0.5, 0.75], base: "Ground_Floor", all: ["Basement", "Ground_Floor", "Second_Floor", "Third_Floor"],
    floors: ["Basement", "Ground_Floor", "Second_Floor", "Third_Floor"] },
  laboratory: { svg: "Labs", b: [[-93.5, -474], [-297, -184]], m: 2, base: "First_Level", all: ["Technical_Level", "First_Level", "Second_Level"],
    floors: ["Technical_Level", "First_Level", "Second_Level"] },
};
const ovSvg = {}, ovTex = {};
async function updateOverlay() {
  const cfg = map && OV[MODEL_OF[map.id] || map.id];
  if (!SHOW.ov || !cfg) { devUniforms.uOvOn.value = 0; return; }
  const want = floorSel >= 0 && cfg.floors ? [...new Set([cfg.floors[floorSel], ...(cfg.keepBase ? [cfg.base] : [])])] : [cfg.base];
  const key = cfg.svg + "|" + want.join(",");
  try {
    if (!ovTex[key]) {
      ovSvg[cfg.svg] ||= await (await fetch(`maps/svg/${cfg.svg}.svg`)).text();
      const doc = new DOMParser().parseFromString(ovSvg[cfg.svg], "image/svg+xml"), root = doc.documentElement;
      for (const id of cfg.all) { const g = doc.getElementById(id); if (g && !want.includes(id)) g.setAttribute("style", "display:none"); }
      // clean-up: map borders, danger hatching, power lines, quest marks and direction arrows are clutter on a 3D map
      const hide = doc.createElementNS("http://www.w3.org/2000/svg", "style");
      hide.textContent = ".map_border,.danger,.danger_small,.powerline,.task,.shadow{filter:none}.map_border,.danger,.danger_small,.powerline,.task{display:none}";
      root.appendChild(hide);
      for (const g of doc.querySelectorAll("g[id]")) if (/^(Arrows|Map_Limit|limit|Border)$/i.test(g.id)) g.setAttribute("style", "display:none");
      const vb = root.getAttribute("viewBox").split(/[ ,]+/).map(Number);
      let w = 4096, h = Math.round(w * vb[3] / vb[2]); if (h > 4096) { h = 4096; w = Math.round(h * vb[2] / vb[3]); }
      root.setAttribute("width", w); root.setAttribute("height", h);
      const url = URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(doc)], { type: "image/svg+xml" }));
      const img = new Image(); img.src = url; await img.decode();
      const cv = document.createElement("canvas"); cv.width = w; cv.height = h; cv.getContext("2d").drawImage(img, 0, 0, w, h); URL.revokeObjectURL(url);
      const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.NoColorSpace; t.anisotropy = 8; t.generateMipmaps = true; t.minFilter = THREE.LinearMipmapLinearFilter;
      ovTex[key] = t;
    }
    if (!SHOW.ov || OV[MODEL_OF[map.id] || map.id] !== cfg) return;
    const [[x1, z1], [x2, z2]] = cfg.b, sh = cfg.shift || [0, 0];
    devUniforms.uOv.value = ovTex[key]; devUniforms.uOvB.value.set(x1 + sh[0], z1 + sh[1], x2 - x1, z2 - z1);
    devUniforms.uOvMode.value = cfg.m; devUniforms.uAxis.value.set(AXIS.x, AXIS.z); devUniforms.uOvOn.value = 0.88;
  } catch (e) { console.error(e); devUniforms.uOvOn.value = 0; }
}

// ---------- floor slice ----------
function setupSlice() {
  for (const id of ["ymin", "ymax"]) { const el = $(id); el.min = map.ymin; el.max = map.ymax; }
  $("ymin").value = map.ymin; $("ymax").value = map.ymax; applySlice();
}
function applySlice(exactLo, exactHi) {
  let lo, hi;
  if (exactLo != null) { lo = exactLo; hi = exactHi; $("ymin").value = lo; $("ymax").value = hi; }
  else {
    lo = +$("ymin").value; hi = +$("ymax").value;
    if (lo > hi) { if (document.activeElement === $("ymin")) $("ymax").value = hi = lo; else $("ymin").value = lo = hi; }
  }
  uniforms.uYMin.value = lo - 0.01; uniforms.uYMax.value = hi + 0.01;
  devClip.value = (exactLo != null ? hi - 0.6 : hi) + 0.01; // floor views cut just under the next floor's slab
  $("ymin-o").textContent = lo.toFixed(1) + " m"; $("ymax-o").textContent = hi.toFixed(1) + " m";
}
for (const id of ["ymin", "ymax"]) $(id).addEventListener("input", () => {
  if (floorSel >= 0) { floorSel = -1; document.querySelectorAll("#floors button").forEach((b) => b.setAttribute("aria-pressed", "false")); }
  applySlice(); computeHotspots();
});

// ---------- hover ----------
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2();
let hoverI = -1;
canvas.addEventListener("pointermove", (ev) => {
  if (!map || ev.buttons) { $("tip").hidden = true; return; }
  const r = canvas.getBoundingClientRect();
  mouse.set(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(mouse, camera);
  ray.params.Points.threshold = camera.position.distanceTo(controls.target) * 0.012;
  const hits = ray.intersectObject(basePts).filter((h) => { const y = map.pos[h.index * 3 + 1]; return y >= uniforms.uYMin.value && y <= uniforms.uYMax.value; });
  hits.sort((a, b) => (chanceAt[b.index] > 0) - (chanceAt[a.index] > 0) || a.distanceToRay - b.distanceToRay);
  const h = hits[0];
  if (!h) { $("tip").hidden = true; hoverI = -1; return; }
  hoverI = h.index; showTip(h.index, ev.clientX - r.left, ev.clientY - r.top, r);
});
canvas.addEventListener("pointerleave", () => { $("tip").hidden = true; });
function showTip(i, x, y, r) {
  const p = map.points[i], arr = map.byPoint[i], has = p[3];
  // per raid = has loot x share; "if loot" = the share: which item it is when the spot has loot
  const top = arr.slice(0, 6), extra = arr.slice(6).filter(([tpl]) => selSet.has(tpl)).slice(0, 2);
  const row = ([tpl, c]) => `<div class="r${selSet.has(tpl) && chanceAt[i] > 0 ? " hit" : ""}"><span>${esc(ITEMS[tpl]?.[0] || tpl)}</span><span>${fmtPct(has > 0 ? c / has : 0)}</span><span>${fmtPct(c)}</span></div>`;
  const rest = arr.length - top.length - extra.length;
  const line = has >= 0.995 ? "Has loot <b>every raid</b>" : `Has loot in <b>${fmtPct(has)}</b> of raids${has > 0 ? ` (about 1 in ${Math.max(1, Math.round(1 / has))})` : ""}`;
  const mine = chanceAt[i] > 0 && selSet.size > 1 ? `<p class="line" style="margin:8px 0 0">Anything in your search: <b>${fmtPct(chanceAt[i])}</b> per raid</p>` : "";
  $("tip").innerHTML = `<h4>Loot spot</h4><p class="line">${line}</p>
    <div class="r th"><span>Item</span><span>If loot</span><span>Per raid</span></div>
    ${top.concat(extra).map(row).join("")}${rest > 0 ? `<div class="r"><span>${rest} other item${rest > 1 ? "s" : ""}</span><span></span><span></span></div>` : ""}${mine}`;
  const t = $("tip"); t.hidden = false;
  const w = t.offsetWidth, hh = t.offsetHeight;
  t.style.left = Math.min(x + 14, r.width - w - 8) + "px"; t.style.top = Math.min(y + 14, r.height - hh - 8) + "px";
}

// ---------- map picker + routing ----------
function buildMapButtons() {
  $("maps").innerHTML = GROUPS.map((g, gi) => g.todo
    ? `<button class="map-btn" disabled title="Streets is on the to-do list">${g.name}<span class="tag">To do</span></button>`
    : `<button class="map-btn" data-g="${gi}" aria-pressed="false">${g.name}</button>`).join("");
  $("maps").addEventListener("click", (e) => { const b = e.target.closest(".map-btn[data-g]"); if (!b) return; go(GROUPS[+b.dataset.g].ids[0]); });
}
function syncPicker(id) {
  const gi = GROUPS.findIndex((g) => g.ids.includes(id));
  document.querySelectorAll(".map-btn[data-g]").forEach((b) => b.setAttribute("aria-pressed", String(+b.dataset.g === gi)));
  const g = GROUPS[gi], v = $("variants");
  v.hidden = !g.vlabels;
  if (g.vlabels) v.innerHTML = g.ids.map((mid, i) => `<button class="chip" data-id="${mid}" aria-pressed="${mid === id}">${g.vlabels[i]}</button>`).join("");
}
$("variants").addEventListener("click", (e) => { const b = e.target.closest(".chip"); if (b) go(b.dataset.id); });
function go(id) { const slug = SLUG[id]; if (location.hash.slice(1) !== slug) location.hash = slug; else route(); }
function route() {
  const slug = location.hash.slice(1);
  let id = Object.keys(SLUG).find((k) => SLUG[k] === slug);
  if (!id || id === "tarkovstreets") id = "bigmap";
  syncPicker(id);
  if (map?.id !== id) loadMap(id).catch((err) => { $("loading").hidden = false; $("loading").textContent = "Could not load this map's data"; console.error(err); });
}
addEventListener("hashchange", route);

let qTimer;
$("q").addEventListener("input", () => { clearTimeout(qTimer); qTimer = setTimeout(() => { sel.tpl = null; refresh(); }, 120); });
$("cat").addEventListener("change", () => { sel.tpl = null; refresh(); });
$("price").addEventListener("change", () => { sel.tpl = null; refresh(); });

// ---------- loop ----------
const v3 = new THREE.Vector3();
function tick() {
  controls.update();
  const dist = camera.position.distanceTo(controls.target);
  const near = Math.max(0.2, dist / 300), far = dist * 6 + 3000;
  if (Math.abs(camera.near - near) > near * 0.1 || Math.abs(camera.far - far) > far * 0.1) { camera.near = near; camera.far = far; camera.updateProjectionMatrix(); }
  renderer.render(scene, camera);
  const w = stage.clientWidth, h = stage.clientHeight;
  const placed = [];
  if (SHOW.pins) document.querySelectorAll(".pin").forEach((el) => {
    const hs = hotspots[+el.dataset.i]; if (!hs) return;
    v3.copy(hs.p).project(camera);
    const x = ((v3.x + 1) / 2) * w, y = ((1 - v3.y) / 2) * h;
    const clash = placed.some(([px, py]) => Math.abs(px - x) < 110 && Math.abs(py - y) < 30);
    const vis = v3.z < 1 && Math.abs(v3.x) < 1.1 && Math.abs(v3.y) < 1.1 && !clash;
    el.style.display = vis ? "" : "none";
    if (vis) placed.push([x, y]);
    el.style.left = x + "px"; el.style.top = y + "px";
  });
  for (const m of runMarks) { // loot-run markers sit on top of everything
    v3.copy(m.p).project(camera);
    const vis = v3.z < 1 && Math.abs(v3.x) < 1.05 && Math.abs(v3.y) < 1.05;
    m.el.hidden = !vis; if (vis) { const x = ((v3.x + 1) / 2) * w, y = ((1 - v3.y) / 2) * h; m.el.style.left = x + "px"; m.el.style.top = y + "px"; placed.push([x, y]); }
  }
  const lo = uniforms.uYMin.value, hi = uniforms.uYMax.value;
  for (const m of marks) {
    const on = m.kind === "names" ? SHOW.names : m.kind === "a" ? (SHOW.p || SHOW.s) : SHOW[m.kind];
    let vis = on && m.hi >= lo && m.lo <= hi;
    if (vis) {
      v3.copy(m.p).project(camera);
      vis = v3.z < 1 && Math.abs(v3.x) < 1.05 && Math.abs(v3.y) < 1.05;
      if (vis) {
        const x = ((v3.x + 1) / 2) * w, y = ((1 - v3.y) / 2) * h;
        const half = m.kind === "names" ? 40 : 60;
        vis = !placed.some(([px, py]) => Math.abs(px - x) < half + 40 && Math.abs(py - y) < 20);
        if (vis) { placed.push([x, y]); m.el.style.left = x + "px"; m.el.style.top = y + "px"; }
      }
    }
    m.el.hidden = !vis;
  }
  requestAnimationFrame(tick);
}

// ---------- boot ----------
(async () => {
  resize();
  INDEX = await getJSON("data/index.json");
  ITEMS = INDEX.items; CATS = INDEX.categories;
  buildCatSelect(); buildMapButtons();
  $("about").innerHTML = `<b>How the odds work.</b> Each spot's chance simulates SPT 4.1's loose-loot draw 6,000 times with the pack's loot amount (0.7× SPT's default). Container chances come straight from SPT 4.1.
    <b>Data:</b> loose-loot spots from a public copy of SPT's database (game version 0.16.8). They match your server closely but not exactly until your server's own files are loaded. Mod-added items (Rare Collectibles) aren't included.
    <b>Map:</b> a rough blockout built from <a href="https://github.com/the-hideout/tarkov-dev-svg-maps" target="_blank" rel="noopener" style="color:inherit">tarkov.dev's SVG maps</a> (CC BY-NC-SA 4.0), with heights from the loot spots. Place names, extracts and transits are from <a href="https://tarkov.dev" target="_blank" rel="noopener" style="color:inherit">tarkov.dev</a> and match live Tarkov, so a few may differ on SPT.`;
  tick();
  route();
})().catch((e) => { $("loading").textContent = "Could not load the loot data"; console.error(e); });
</script>
